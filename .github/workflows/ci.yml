name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/pyproject.toml }
      - run: pip install -e "pipeline[dev]"
      - run: ruff check pipeline
      - run: pytest pipeline/tests -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e pipeline && python -m ctw_monitor.cli synthetic --out web/public/data
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci && npx vitest run && npm run build
