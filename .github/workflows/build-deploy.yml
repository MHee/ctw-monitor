# Daily data build + Pages deploy. Data are never committed: they exist only in the
# Pages artifact. See docs/ARCHITECTURE.md (decision 2) and docs/OPERATIONS.md.
name: Build data and deploy

on:
  schedule:
    - cron: "17 13 * * *"          # 13:17 UTC daily; off the hour to dodge queue delays
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Ignore the raw-data cache and refetch the whole window"
        type: boolean
        default: false
      source:
        description: "pipeline = run the Python build here; release = deploy products uploaded by local mode"
        type: choice
        options: [pipeline, release]
        default: pipeline
  push:
    branches: [main]
    paths: ["web/**", "pipeline/**", "config/**", "schema/**", ".github/workflows/build-deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      SOURCE: ${{ inputs.source || 'pipeline' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: env.SOURCE == 'pipeline'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install pipeline (core dependencies only)
        if: env.SOURCE == 'pipeline'
        run: pip install -e pipeline

      - name: Restore raw-data cache
        if: env.SOURCE == 'pipeline' && !inputs.full_rebuild
        uses: actions/cache@v6
        with:
          path: .cache/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Download frozen tidal constants (rule 5)
        if: env.SOURCE == 'pipeline'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release download tides-latest --pattern tidal_constants.json --dir .cache --clobber
          || echo "::warning::no tidal constants release asset; gauges use a window harmonic fit"

      - name: Fetch last good products from the live site
        if: env.SOURCE == 'pipeline'
        run: python -m ctw_monitor.cli pull-last-good --site "$SITE_URL" --out .cache/last_good || true

      - name: Build products
        if: env.SOURCE == 'pipeline'
        env:
          ONC_API_TOKEN: ${{ secrets.ONC_API_TOKEN }}
        run: >
          python -m ctw_monitor.cli build --out web/public/data --cache .cache/raw
          --tides .cache/tidal_constants.json --last-good .cache/last_good ${{ inputs.full_rebuild && '--full' || '' }}

      - name: Use products uploaded by local mode
        if: env.SOURCE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/public/data
          gh release download products-latest --pattern '*.json' --dir web/public/data --clobber

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm ci && npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
