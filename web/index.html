<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coastal-trapped wave monitor — Ocean Networks Canada</title>
    <meta name="description" content="Subtidal sea level and bottom pressure along the eastern Pacific margin, Central America to British Columbia." />
    <link rel="icon" href="https://www.oceannetworks.ca/misc/icons/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Apply a saved theme before first paint (no light/dark flash). -->
    <script>
      (function () { var t = localStorage.getItem('onc-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
