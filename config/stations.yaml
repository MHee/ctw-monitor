# Station configuration for the coastal-trapped wave monitor.
# Coordinates: ONC locations API, CHS IWLS metadata, NOAA CO-OPS mdapi (2026-10-07);
# Mexican/Central American gauges from the ne-pacific-margin-data skill table.
# Order of tide_gauges = equatorward to poleward along the open coast.
# pressure: station = the gauge's own barometer (CO-OPS air_pressure, CHS ap1; all CO-OPS
# gauges here had one on 2026-10-07); nearest = nearest gauge barometer; eccc = ECCC
# climate-hourly (falls back to nearest); era5 = weekly ERA5 job (not yet: "none").

schema_version: "0.1.0"

coastal_path:
  # Waypoints the along-coast distance follows (0 km at Neah Bay, poleward positive).
  # Approximate cape coordinates. The path must stay at sea: a straight San Francisco -
  # Crescent City line crosses land. Checked 2026-10-07: every enabled gauge lies within
  # 32 km of the path except Puerto Vallarta (54 km, inside Bahia de Banderas).
  # North of Cape Scott the path follows the mainland shelf (Queen Charlotte Sound,
  # Hecate Strait east side), not Cape St James, so Pruth Bay projects onto it.
  zero_at: neah_bay
  waypoints:
    - [Acajutla, 13.57, -89.84]
    - [Puerto Chiapas, 14.70, -92.40]
    - [Salina Cruz, 16.15, -95.20]
    - [Puerto Angel, 15.65, -96.50]
    - [Lazaro Cardenas, 17.92, -102.18]
    - [Manzanillo, 19.05, -104.32]
    - [Cabo Corrientes, 20.40, -105.70]
    - [Cabo San Lucas, 22.88, -109.91]
    - [Cabo San Lazaro, 24.80, -112.32]
    - [Punta Eugenia, 27.85, -115.08]
    - [Ensenada, 31.85, -116.62]
    - [San Diego, 32.70, -117.25]
    - [Point Dume, 34.00, -118.81]
    - [Point Conception, 34.45, -120.47]
    - [Point Reyes, 38.00, -123.02]
    - [Point Arena, 38.95, -123.74]
    - [Cape Mendocino, 40.44, -124.41]
    - [Cape Blanco, 42.84, -124.56]
    - [Columbia River mouth, 46.25, -124.10]
    - [Cape Flattery, 48.38, -124.73]
    - [Estevan Point, 49.38, -126.54]
    - [Cape Scott, 50.78, -128.43]
    - [Calvert Island, 51.62, -128.20]
    - [Aristazabal Island, 52.60, -129.30]
    - [Banks Island, 53.40, -130.45]
    - [Prince Rupert, 54.32, -130.33]
  gap_mask_km: 150   # mask grid cells with no gauge within this distance

